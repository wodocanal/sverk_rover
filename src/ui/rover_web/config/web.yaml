web_gateway_node:
  ros__parameters:
    bind_address: 0.0.0.0
    port: 8765
    command_topic: /cmd_vel
    base_driver_node_name: /base_driver_node
    wheel_odometry_node_name: /wheel_odometry_node
    drive_type_file: ~/.config/sverk-rover/drive_type
    # Leave empty to use rover_device_manager/config/device_manager.yaml.
    device_setup_config: ''
    camera_node_name: /usb_camera_node
    vision_node_name: /camera_detector_node
    agent_input_topic: package://rover_interfaces/config/topics.yaml#topics.agent_text_command
    agent_answer_topic: package://rover_interfaces/config/topics.yaml#topics.agent_answer
    agent_status_topic: package://rover_interfaces/config/topics.yaml#topics.agent_status
    fleet_connection_topic: package://rover_interfaces/config/topics.yaml#topics.fleet_connection
    fleet_received_command_topic: package://rover_interfaces/config/topics.yaml#topics.fleet_received_command
    fleet_settings_file: ~/.config/sverk-rover/fleet_connection.json
    fleet_bridge_node_name: /fleet_text_bridge
    lidar_node_name: /sllidar_node
    led_strip_node_name: /led_strip_node
    octoliner_node_name: /octoliner_node
    voice_node_name: /waveshare_audio_node
    voice_text_topic: /voice/text
    voice_status_topic: /waveshare_audio/status
    voice_package: rover_waveshare_audio
    voice_executable: waveshare_audio_node
    voice_config_file: ''
    voice_enabled_on_start: false
    voice_page_mode: auto
    octoliner_page_mode: auto
    drive_command_timeout_sec: 0.25
    default_linear_speed_mps: 0.18
    default_lateral_speed_mps: 0.16
    default_angular_speed_radps: 0.7
    max_linear_speed_mps: 0.35
    max_lateral_speed_mps: 0.35
    max_angular_speed_radps: 1.5
    plans_directory: ~/.local/share/sverh-rover-web/plans
    hackathon_files_root: ~/sverk_rover/hackathon_files
    maps_root: ~/sverk_rover/src/motion/rover_navigation/maps/current
    navigation_package: rover_navigation
    navigation_settings_file: ~/.config/sverk-rover/navigation.yaml
    mapping_launch_file: slam.launch.py
    navigation_launch_file: navigation.launch.py
    navigation_scan_topic: /scan_filtered
    planned_path_topic: /plan
    navigation_map_frame: map
    localized_pose_topic: /amcl_pose
    map_save_timeout_sec: 30.0
    terminal_enabled: true
    terminal_url: ''
    terminal_port: 7681
    terminal_path: /
    rosboard_enabled: true
    rosboard_port: package://rosboard/config/rosboard.yaml#rosboard.ros__parameters.port
    servo_enabled: true
    odom_topic: /odom
    wheel_odom_topic: /wheel/odometry
    imu_topic: /imu/data
    diagnostics_topic: /diagnostics
    activity_limit: 1000
    stop_hold_sec: 0.75
    identity_file: package://rover_description/config/rover_v1.yaml
    rover_config_file: package://rover_description/config/rover_v1.yaml
launch:
  start_terminal: true
  terminal_bind_address: 0.0.0.0
  terminal_workspace: ''
