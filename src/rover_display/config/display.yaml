rover_status_display_node:
  ros__parameters:
    display_env: :0
    xauthority_path: ~/.Xauthority
    window_title: Rover Display
    header_text: ROVER
    footer_text: Touchscreen status panel
    full_screen: true
    refresh_sec: 1.0
    background_color: '#07141C'
    panel_color: '#0C202B'
    accent_color: '#16B8F3'
    text_color: '#F4FBFF'
    muted_text_color: '#8CB5C7'
    wifi_interface: wlan0
    wifi_control_script: /usr/local/sbin/rover-hotspot-control.sh
    wifi_hotspot_ssid: Rover-AP
    wifi_hotspot_password: StrongPassword123
    wifi_hotspot_address: 192.168.50.1/24
    wifi_hotspot_dhcp_start: 192.168.50.10
    wifi_hotspot_dhcp_end: 192.168.50.200
    wifi_hotspot_band: bg
    wifi_hotspot_channel: 1
    wifi_hotspot_country: RU
