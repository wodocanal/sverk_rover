peripherals:
  use_lidar: true
  use_camera: true
  use_vision: true
  use_led_strip: true
  use_octoliner: true
  use_voice: false
  use_waveshare_audio: false

lidar:
  model: sllidar_c1
  channel_type: serial
  serial_port: /tmp/rover_devices/lidar
  serial_baudrate: 460800
  probe_baudrates:
  - 460800
  - 115200
  - 256000
  - 1000000
  frame_id: lidar_link
  inverted: false
  angle_compensate: true
  scan_mode: Standard
  scan_frequency: 10.0
  range_min: 0.17

camera:
  device: /dev/video0
  image_topic: /image_raw
  compressed_image_topic: /image_raw/compressed
  frame_id: camera_optical_frame
  width: 1280
  height: 720
  fps: 30.0
  use_mjpeg: true
  publish_raw: true
  publish_compressed: true
  jpeg_quality: 85
  reconnect_interval_sec: 2.0
  get_frame_service: get_frame

vision:
  enabled: false
  model_name: ssd_mobilenet_v1_coco_2017_11_17
  models_directory: package://rover_vision/models
  input_topic: /image_raw
  processed_image_topic: /image_processed
  processed_compressed_image_topic: /image_processed/compressed
  frame_id: camera_optical_frame
  publish_raw: true
  publish_compressed: true
  confidence_threshold: 0.30
  nms_threshold: 0.45
  max_processing_fps: 10.0
  annotate_labels: true
  annotate_confidence: true
  line_thickness: 2
  jpeg_quality: 85

led_strip:
  led_transport: auto
  spi_bus: 1
  spi_device: 0
  led_count: 16
  frame_id: led_strip
  state_topic: /led_strip/state
  set_state_service: /led_strip/set_state
  native_state_topic: /led/state
  set_effect_service: /led/set_effect
  set_leds_service: /led/set_leds
  enabled: false
  brightness: 0.35
  effect: fill
  effect_speed_hz: 1.0
  primary_color: '#16B8F3'
  secondary_color: '#FFFFFF'
  startup_self_test: true
  startup_test_color: '#FFFFFF'
  startup_test_step_sec: 0.06
  startup_test_hold_sec: 0.5
  animation_rate_hz: 30.0
  state_publish_hz: 5.0

octoliner:
  i2c_address: 42
  i2c_bus: 1
  poll_rate_hz: 50.0
  frame_id: octoliner_link
  reading_topic: /octoliner/reading
  analog_topic: /octoliner/analog
  pattern_topic: /octoliner/pattern
  line_position_topic: /octoliner/line_position
  tracked_line_topic: /octoliner/tracked_line_position
  line_visible_topic: /octoliner/line_visible
  sensitivity_topic: /octoliner/sensitivity
  set_sensitivity_service: /octoliner/set_sensitivity
  optimize_on_black_service: /octoliner/optimize_on_black
  sensitivity: 0.8
  auto_optimize_on_start: false

voice:
  serial_device: /dev/myspeech
  baudrate: 115200
  read_timeout_sec: 0.1
  reconnect_interval_sec: 2.0
  command_topic: /voice/command
  command_id_topic: /voice/command_id
  raw_frame_topic: /voice/raw_frame
  raw_bytes_topic: /voice/raw_bytes
  speak_id_topic: /voice/speak_id
  speak_label_topic: /voice/speak_label
  speak_phrase_service: /voice/speak_phrase
  publish_raw_bytes: true
  single_byte_command_mode: true
  receive_frame_header:
  - 170
  - 85
  transmit_frame_header:
  - 170
  - 255
  frame_tail: 251
  broadcast_frame_type: 255
  command_labels:
  - '10:close_light'
  phrase_labels:
  - '103:ready'

waveshare_audio:
  serial_device: /dev/waveshare_audio
  baudrate: 2000000
  read_timeout_sec: 1.0
  reconnect_interval_sec: 2.0
  expected_sample_rate: 16000
  expected_frame_samples: 320
  output_topic: /voice/text
  status_topic: /waveshare_audio/status
  transcript_json_topic: /voice/transcript
  publish_transcript_json: true
  whisper_model: base
  language: ru
  device: auto
  condition_on_previous_text: false
  temperature: 0.0
  min_rms: 350.0
  start_frames: 3
  stop_frames: 35
  pre_roll_frames: 8
  max_utterance_seconds: 12.0
  utterance_queue_size: 4
  save_wavs_dir: ''
  append_file: ''
  jsonl_file: ''
  tcp_sink: ''
  serial_sink_device: ''
  serial_sink_baudrate: 115200
